{% extends "base.html" %}

{% block meta %}
    <title>Add Experience - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <div class="form-heading">
                    <span>★</span>
                    <h1>Add Experience</h1>
                    <span>★</span>
                </div>

                <form method="post" action="{% url 'main:create_experience' %}" class="experience-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <div class="form-actions">
                        <button type="submit" class="button">Add Experience</button>
                        <a href="{% url 'main:show_experience' %}" class="button button-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
